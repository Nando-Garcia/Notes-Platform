name: Terraform LocalStack-Services Per Steps

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply"
        required: true
        default: false
        type: boolean
      lambda_architecture:
        description: "Lambda architecture"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - arm64
          - x86_64
      backend_ref:
        description: "Backend branch/tag/SHA to build lambda"
        required: true
        default: main
        type: string
      debug_until:
        description: "Run steps until this stage (1-8)"
        required: true
        default: "8"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
          - "7"
          - "8"
jobs:
  build-infra-notes-platform:
    runs-on: ubuntu-latest
    env:
      TF_VAR_db_host: localhost
      TF_VAR_db_port: "5432"
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_db_username: ${{ secrets.DB_USER }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    services:
      localstack:
        image: localstack/localstack:3.0.0
        ports:
          - 4566:4566
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
        env:
          SERVICES: s3,sqs,lambda,iam,logs,secretsmanager,cloudwatch
          DEBUG: 1

      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout infra repository
        if: ${{ github.event.inputs.debug_until >= '1' }}
        uses: actions/checkout@v4

      - name: Validate required secrets
        if: ${{ github.event.inputs.debug_until >= '2' }}
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          [ -n "$DB_NAME" ] || { echo "Missing required secret: DB_NAME"; exit 1; }
          [ -n "$DB_USER" ] || { echo "Missing required secret: DB_USER"; exit 1; }
          [ -n "$DB_PASSWORD" ] || { echo "Missing required secret: DB_PASSWORD"; exit 1; }

      - name: Download Lambda artifact built by build-lambda-artifact.yml
        if: ${{ github.event.inputs.debug_until >= '3' }}
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-lambda-artifact.yml
          name: sqs-consumer-zip
          path: backend-artifacts

      - name: Check zip exists
        if: ${{ github.event.inputs.debug_until >= '4' }}
        run: |
          ls -la backend-artifacts
          test -f backend-artifacts/sqs-consumer.zip || { echo "Artifact not found! Did build-lambda-artifact.yml run first?"; exit 1; }

      - name: Setup Terraform
        if: ${{ github.event.inputs.debug_until >= '5' }}
        uses: hashicorp/setup-terraform@v3

      - name: Wait for LocalStack readiness
        if: ${{ github.event.inputs.debug_until >= '6' }}
        run: |
          for i in {1..45}; do
            HEALTH_JSON="$(curl -sS --max-time 3 http://localhost:4566/_localstack/health || true)"
            if [ -n "$HEALTH_JSON" ] && echo "$HEALTH_JSON" | grep -Eq '"(initialized|available|running)"'; then
              echo "LocalStack is ready"
              echo "$HEALTH_JSON"
              exit 0
            fi
            echo "Waiting for LocalStack... attempt $i/45"
            sleep 2
          done
          echo "LocalStack did not become ready in time"
          echo "Last health response:"
          curl -sS --max-time 5 http://localhost:4566/_localstack/health || true
          exit 1

      - name: Resolve lambda architecture
        if: ${{ github.event.inputs.debug_until >= '7' }}
        id: arch
        run: |
          # INPUT_ARCH="${{ github.event.inputs.lambda_architecture }}"
          INPUT_ARCH="${{ github.event.inputs.lambda_architecture || 'auto' }}"
          if [ "$INPUT_ARCH" != "auto" ]; then
            echo "value=$INPUT_ARCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MACHINE_ARCH="$(uname -m)"
          if [ "$MACHINE_ARCH" = "arm64" ] || [ "$MACHINE_ARCH" = "aarch64" ]; then
            echo "value=arm64" >> "$GITHUB_OUTPUT"
          else
            echo "value=x86_64" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform init
        if: ${{ github.event.inputs.debug_until >= '8' }}
        working-directory: infra/infra
        run: terraform init

      - name: Terraform plan
        if: ${{ github.event.inputs.debug_until >= '8' }}
        working-directory: infra/infra
        run: |
          terraform plan \
            -var="lambda_architecture=${{ steps.arch.outputs.value }}" \
            -var="lambda_zip_path=${{ github.workspace }}/backend-artifacts/sqs-consumer.zip"

      - name: Terraform apply
        if: ${{ github.event.inputs.debug_until >= '8' && github.event.inputs.apply == 'true' }}
        working-directory: infra/infra
        run: |
          terraform apply -auto-approve \
            -var="lambda_architecture=${{ steps.arch.outputs.value }}" \
            -var="lambda_zip_path=${{ github.workspace }}/backend-artifacts/sqs-consumer.zip"
